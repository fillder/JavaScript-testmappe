<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<label for="bestilling">Bestill vafler</label>
		<input type="number" id="antallVafler" name="bestilling" min="1" value="1" size="2" />
		<button onclick="stekVafler()">Stek</button>
		<p>Status: <span id="stekeStatus">Klar til ny bestilling!</span></p>
		<p>Antall vafler: <span id="vaflerTekst">0</span></p>
	</body>
	<script>
		let antallVafler = 0;
		let stekerVaffel = false;
		const vaflerTekst = document.getElementById("vaflerTekst");
		const stekeStatus = document.getElementById("stekeStatus");

		function stekVafler() {
			if (stekerVaffel == false) {
				let antallKjop = document.getElementById("antallVafler").value;
				stekerVaffel = true;
				stekFlereVafler(antallKjop);
			} else {
				stekeStatus.textContent = "Bestilling pågår";
			}
		}
		function stekFlereVafler(antallKjop) {
			for (let i = 0; i < antallKjop; i++) {
				stekeStatus.textContent = `Steker ${i + 1} vafler`;
				// simulerer steketid
				setTimeout(() => {
					antallVafler += 1;
					vaflerTekst.textContent = antallVafler;
					if (i == antallKjop - 1) {
						stekerVaffel = false;
					}
					stekeStatus.textContent = "Klar til ny bestilling!";
				}, 3000);
			}
		}
	</script>
</html>
