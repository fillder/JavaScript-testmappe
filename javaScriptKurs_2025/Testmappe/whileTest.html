<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body></body>
	<script>
		// Eksempel på lagring av mange vaffler samtidig
		function lagBatchVaffler(antallVaffler) {
			for (let i = 0; i < antallVaffler; i++) {
				console.log(`Steker vaffel nummer ${i + 1}`);

				// Simuler stekingstid
				setTimeout(() => {
					console.log(`Vaffel ${i + 1} er ferdig stekt!`);
				}, 2000); // 2 sekunder per vaffel
			}
		}

		// Test funksjonen
		lagBatchVaffler(3);
	</script>
</html>
