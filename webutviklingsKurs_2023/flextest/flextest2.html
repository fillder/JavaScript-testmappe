<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      border: 2px black solid;
      width: 800px;
      height: 300px;
    }
    section {
      display: flex;
    }
    .inndeling {
      display: flex;
      flex-wrap: wrap;
    }
    .farge {
      width: 25px;
      height: 25px;
    }
    .rod {
      background-color: #ec4f28;
      width: 200px;
    }
    .oransje {
      background-color: #e68d2f;
    }
    .gul {
      background-color: #e6ce2f;
    }
    .gronn {
      background-color: #839e53;
    }
    .blå {
      background-color: #1fa6e2;
    }
    .indigo {
      background-color: #7b77ff;
    }
    .fiolett {
      background-color: #c973af;
    }
  </style>
  <body>
    <section>
      <img src="https://picsum.photos/600/300" />
      <div class="inndeling">
        <div class="farge rod"></div>
      </div>
      <div class="inndeling">
        <div class="farge oransje"></div>
        <div class="farge gul"></div>
      </div>
      <div class="inndeling">
        <div class="farge gronn"></div>
        <div class="farge blå"></div>
        <div class="farge indigo"></div>
        <div class="farge fiolett"></div>
      </div>
    </section>
  </body>
</html>
